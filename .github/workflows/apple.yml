name: Apple Watch app

on:
  pull_request:
    paths:
      - "apple/**"
      - ".github/workflows/apple.yml"
  push:
    branches: [main]
    paths:
      - "apple/**"
      - ".github/workflows/apple.yml"

permissions:
  contents: read

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Xcode 27 is only on the preview image for now (actions/runner-images#14404).
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      PROJECT: apple/PurpleRadio/PurpleRadio.xcodeproj
      SCHEME: PurpleRadio Watch App
    steps:
      - uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for device
        run: >
          xcodebuild build -project "$PROJECT" -scheme "$SCHEME"
          -destination 'generic/platform=watchOS'
          CODE_SIGNING_ALLOWED=NO

      # The image's watchOS runtime is still mounting when the job starts, so wait for
      # it. Its preinstalled watch simulators show as unavailable, so create one.
      - name: Create a watch simulator
        run: |
          if ! xcrun simctl runtime list | grep -q '^watchOS'; then
            xcodebuild -downloadPlatform watchOS
          fi
          for _ in $(seq 60); do
            xcrun simctl list runtimes available | grep -q '^watchOS' && break
            sleep 5
          done
          xcrun simctl list runtimes available
          runtime=$(xcrun simctl list runtimes available --json \
            | jq -c '[.runtimes[] | select(.platform == "watchOS")] | first')
          runtime_id=$(jq -r '.identifier' <<< "$runtime")
          device_type=$(jq -r '.supportedDeviceTypes | map(select(.productFamily == "Apple Watch")) | first | .identifier' <<< "$runtime")
          echo "Runtime: $runtime_id, device type: $device_type"
          id=$(xcrun simctl create "CI Watch" "$device_type" "$runtime_id")
          echo "SIMULATOR_ID=$id" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: >
          xcodebuild test -project "$PROJECT" -scheme "$SCHEME"
          -destination "id=$SIMULATOR_ID"
          -only-testing:"PurpleRadio Watch AppTests"
          CODE_SIGNING_ALLOWED=NO
